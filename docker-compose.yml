# ==============================================================================
# InvenGest_POS — Orquestación Completa (PostgreSQL 16 + 6 Servicios)
# Compatible con Hostinger VPS KVM 2 (8 GB RAM) y Desarrollo Local
# ==============================================================================
name: invengest-pos

services:
  # ----------------------------------------------------------------------------
  # 0. Base de Datos PostgreSQL 16 Unificada (4 esquemas: auth, catalog, transaction, analytics)
  #    Aislada en la red interna invengest-net (NO publica puerto al host)
  # ----------------------------------------------------------------------------
  postgres-invengest:
    image: postgres:16-alpine
    container_name: postgres-invengest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-invengest_pos}
      POSTGRES_USER: ${DB_USER:-invengest_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_invengest_data:/var/lib/postgresql/data
    expose:
      - "5432"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-invengest_user} -d ${DB_NAME:-invengest_pos}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - invengest-net

  # ----------------------------------------------------------------------------
  # 1. Microservicio de Autenticación y RBAC (auth-service :8081)
  # ----------------------------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: invengest-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      AUTH_SERVICE_PORT: 8081
      DB_HOST: ${DB_HOST:-postgres-invengest}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA_AUTH: ${DB_SCHEMA_AUTH:-auth}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8085}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_DEFAULT:--Xms192m -Xmx384m -XX:+UseSerialGC -Xss512k -Duser.timezone=America/Bogota}
    expose:
      - "8081"
    mem_limit: 512m
    depends_on:
      postgres-invengest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - invengest-net

  # ----------------------------------------------------------------------------
  # 2. Microservicio Stateless de Notificaciones por Correo (notification-service :8085)
  # ----------------------------------------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: invengest-notification-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      SERVER_PORT: 8085
      NOTIFICATION_SERVICE_PORT: 8085
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_DEFAULT:--Xms192m -Xmx384m -XX:+UseSerialGC -Xss512k -Duser.timezone=America/Bogota}
    expose:
      - "8085"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - invengest-net

  # ----------------------------------------------------------------------------
  # 3. Microservicio de Catálogo Maestro, Stock Batch y TRM USD (catalog-service :8082)
  # ----------------------------------------------------------------------------
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: invengest-catalog-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      SERVER_PORT: 8082
      CATALOG_SERVICE_PORT: 8082
      DB_HOST: ${DB_HOST:-postgres-invengest}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA_CATALOG:-catalog}
      DB_SCHEMA_CATALOG: ${DB_SCHEMA_CATALOG:-catalog}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8084}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8085}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_MEDIUM:--Xms256m -Xmx480m -XX:+UseSerialGC -Xss512k -Duser.timezone=America/Bogota}
    expose:
      - "8082"
    mem_limit: 640m
    depends_on:
      postgres-invengest:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - invengest-net

  # ----------------------------------------------------------------------------
  # 4. Microservicio de Analítica CQRS, Reportes Excel/PDF, TRM y Festivos (analytics-service :8084)
  # ----------------------------------------------------------------------------
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: invengest-analytics-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      SERVER_PORT: 8084
      ANALYTICS_SERVICE_PORT: 8084
      DB_HOST: ${DB_HOST:-postgres-invengest}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA_ANALYTICS:-analytics}
      DB_SCHEMA_ANALYTICS: ${DB_SCHEMA_ANALYTICS:-analytics}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_ANALYTICS:--Xms256m -Xmx576m -XX:+UseSerialGC -Xss512k -Duser.timezone=America/Bogota -Djava.awt.headless=true}
    expose:
      - "8084"
    mem_limit: 768m
    depends_on:
      postgres-invengest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - invengest-net

  # ----------------------------------------------------------------------------
  # 5. Microservicio de Transacciones POS, Kardex, Caja y Festivos (transaction-service :8083)
  # ----------------------------------------------------------------------------
  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: invengest-transaction-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      SERVER_PORT: 8083
      TRANSACTION_SERVICE_PORT: 8083
      DB_HOST: ${DB_HOST:-postgres-invengest}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA_TRANSACTION:-transaction}
      DB_SCHEMA_TRANSACTION: ${DB_SCHEMA_TRANSACTION:-transaction}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8082}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8084}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8085}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_MEDIUM:--Xms256m -Xmx480m -XX:+UseSerialGC -Xss512k -Duser.timezone=America/Bogota}
    expose:
      - "8083"
    mem_limit: 640m
    depends_on:
      postgres-invengest:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - invengest-net

  # ----------------------------------------------------------------------------
  # 6. API Gateway Reactivo WebFlux (:8080 — ÚNICO servicio expuesto al host)
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: invengest-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      SERVER_PORT: 8080
      GATEWAY_PORT: 8080
      API_GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8082}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL:-http://transaction-service:8083}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8084}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8085}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_DEFAULT:--Xms192m -Xmx384m -XX:+UseSerialGC -Xss512k -Duser.timezone=America/Bogota}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    mem_limit: 512m
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - invengest-net

networks:
  invengest-net:
    name: invengest-net
    driver: bridge

volumes:
  postgres_invengest_data:
    name: postgres_invengest_data
