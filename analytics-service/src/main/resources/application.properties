# ==============================================================================
# analytics-service
# ==============================================================================
spring.application.name=analytics-service
server.port=${SERVER_PORT:${ANALYTICS_SERVICE_PORT:8084}}

# Base de Datos PostgreSQL Única (Esquema: analytics)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invengest_pos}?currentSchema=${DB_SCHEMA:${DB_SCHEMA_ANALYTICS:analytics}}
spring.datasource.username=${DB_USER:invengest_user}
spring.datasource.password=${DB_PASSWORD:change_me}

# Pool de Conexiones HikariCP Optimizado
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:2000}

# Configuración JPA / Hibernate (Esquema analytics)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:${DB_SCHEMA_ANALYTICS:analytics}}
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Seguridad JWT y Llave Interna (/internal/**)
jwt.secret=${JWT_SECRET:default_dev_secret_key_must_be_at_least_32_bytes_long_2026}
jwt.issuer=${JWT_ISSUER:invengest-pos-auth}
internal.api-key=${INTERNAL_API_KEY:default_dev_internal_api_key_2026}

# API Externa 1: DolarAPI Colombia (TRM COP -> USD)
dolar.api.url=${DOLAR_API_URL:https://co.dolarapi.com/v1/trm}
trm.cache.ttl-seconds=${TRM_CACHE_TTL_SECONDS:3600}
trm.cache.preload-enabled=${TRM_CACHE_PRELOAD_ENABLED:true}

# API Externa 2: API Colombia Festivos (Calendario Laboral / Estacionalidad)
festivos.api.url=${FESTIVOS_API_URL:https://api-colombia.com/api/v1/Holiday/year}
festivos.cache.ttl-seconds=${FESTIVOS_CACHE_TTL_SECONDS:86400}
festivos.cache.preload-enabled=${FESTIVOS_CACHE_PRELOAD_ENABLED:true}

# Timeouts explícitos para clientes HTTP hacia APIs externas (< 500ms camino caliente)
external.api.connect-timeout-ms=${EXT_API_CONNECT_TIMEOUT_MS:300}
external.api.read-timeout-ms=${EXT_API_READ_TIMEOUT_MS:700}
