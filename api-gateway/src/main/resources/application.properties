# ==============================================================================
# api-gateway — Configuración Spring Boot 4.1.1 / Spring Cloud Gateway WebFlux
# ==============================================================================
spring.application.name=api-gateway
server.port=${SERVER_PORT:${GATEWAY_PORT:${API_GATEWAY_PORT:8080}}}

# ------------------------------------------------------------------------------
# 1. Seguridad JWT (Defensa en Profundidad — HS256 + Expiración + Issuer)
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:default_dev_secret_key_must_be_at_least_32_bytes_long_2026}
jwt.issuer=${JWT_ISSUER:invengest-pos-auth}

# ------------------------------------------------------------------------------
# 2. Timeouts Explícitos del Cliente HTTP Reactivo (Netty)
# ------------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:500}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:3000ms}

# ------------------------------------------------------------------------------
# 3. Configuración Global de CORS
# ------------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins[0]=${CORS_ALLOWED_ORIGINS}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[3]=PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[4]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=3600

# ------------------------------------------------------------------------------
# 4. Tabla de Enrutamiento hacia los 5 Microservicios de Negocio
#    Nota: Las rutas /internal/** están bloqueadas en el filtro de seguridad
#    y nunca tienen predicado de enrutamiento externo.
# ------------------------------------------------------------------------------
# Microservicio 1: auth-service (:8081)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Microservicio 2: catalog-service (:8082)
spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=${CATALOG_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalog/**

# Microservicio 3: transaction-service (:8083)
spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].uri=${TRANSACTION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/transactions/**,/api/transaction/**

# Microservicio 4: analytics-service (:8084)
spring.cloud.gateway.server.webflux.routes[3].id=analytics-service
spring.cloud.gateway.server.webflux.routes[3].uri=${ANALYTICS_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/analytics/**

# Microservicio 5: notification-service (:8085)
spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notificaciones/**

# ------------------------------------------------------------------------------
# 5. Actuator Healthcheck (Orquestación Docker / Hostinger / Render)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
