# ==============================================================================
# notification-service
# ==============================================================================
spring.application.name=notification-service
server.port=${SERVER_PORT:${NOTIFICATION_SERVICE_PORT:8085}}

# Configuración SMTP — Spring Boot Mail (Sin valores reales hardcodeados)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.from=${SPRING_MAIL_FROM:${MAIL_FROM:no-reply@invengest.local}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT_MS:3000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT_MS:5000}

# Pool Asíncrono Dedicado para Envío de Correos (@Async)
notification.async.core-pool-size=${NOTIFICATION_ASYNC_CORE_POOL:2}
notification.async.max-pool-size=${NOTIFICATION_ASYNC_MAX_POOL:4}
notification.async.queue-capacity=${NOTIFICATION_ASYNC_QUEUE_CAPACITY:50}

# Seguridad JWT y Llave Interna (Defensa en Profundidad)
jwt.secret=${JWT_SECRET:default_dev_secret_key_must_be_at_least_32_bytes_long_2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:invengest-pos-auth}
internal.api-key=${INTERNAL_API_KEY:default_dev_internal_api_key_2026}
