# ==============================================================================
# auth-service — Configuración Spring Boot 4.1.1
# ==============================================================================
spring.application.name=auth-service
server.port=${AUTH_SERVICE_PORT:8081}

# Base de Datos PostgreSQL Única (Esquema: auth)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invengest_pos}?currentSchema=${DB_SCHEMA_AUTH:auth}
spring.datasource.username=${DB_USER:invengest_user}
spring.datasource.password=${DB_PASSWORD:change_me}

# Pool de Conexiones HikariCP Optimizado
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:2000}

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA_AUTH:auth}
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Seguridad JWT y Llave Interna
jwt.secret=${JWT_SECRET:default_dev_secret_key_must_be_at_least_32_bytes_long_2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:invengest-pos-auth}
internal.api-key=${INTERNAL_API_KEY:default_dev_internal_api_key_2026}

# Usuario Administrador Inicial (AdminSeeder)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}
admin.email=${ADMIN_EMAIL:admin@invengest.local}
admin.nombre=${ADMIN_NOMBRE:Administrador}
admin.apellido=${ADMIN_APELLIDO:Principal}
admin.telefono=${ADMIN_TELEFONO:3000000000}

# Comunicación Inter-Servicio (OpenFeign -> notification-service)
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:300}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_NOTIFICATION_READ_TIMEOUT_MS:800}
